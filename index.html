<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate Wish Boxes needed to reach six gold stars in Clash of Critters."><title>Critter Evolution Calculator</title><style>body{font:17px system-ui;background:#111a2b;color:#eef3ff;max-width:760px;margin:35px auto;padding:20px}section{background:#202e46;padding:24px;border-radius:14px;margin:18px 0}label{display:block;margin:18px 0}input,select,button{font:inherit;padding:10px;border-radius:7px}input,select{width:100%;box-sizing:border-box}button{background:#aed7ff;border:0;cursor:pointer}p{line-height:1.6}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #657086}#error{color:#ffb5b5}small{color:#c2d4ef}</style></head><body><h1>Critter Evolution Calculator</h1><p>Select the highest star color shown and count only the stars of that color, not the remaining stars in the row.</p><section><label for="color">Star color</label><select id="color"><option value="bronze">Bronze</option><option value="silver">Silver</option><option value="gold">Gold</option></select><label for="count">Number of stars of this color</label><input id="count" type="number" min="1" max="6" step="1" value="6"><small id="hint"></small><label for="progress">Copy progress toward the next star</label><input id="progress" type="number" min="0" step="1" value="0"><p id="mapping"></p><button id="calc" type="button">Calculate</button><p id="error" role="alert"></p><div id="result" aria-live="polite"></div></section><script>
(function(){'use strict';var el=function(id){return document.getElementById(id)};var cost=function(s){return s<6?5:7};var needed=function(s,p,t){var n=0;for(var k=s;k<t;k++)n+=cost(k);return Math.max(0,n-p)};var stars=function(){var c=el('color').value,n=Number(el('count').value);if(el('count').value===''||!Number.isInteger(n)||n<1||n>6)throw new Error('Enter a whole-number star count from 1 to 6.');if(c==='bronze'&&n!==6)throw new Error('This calculator starts at 6 bronze stars. Select 6 bronze, or 1-6 silver or gold.');return c==='bronze'?0:c==='silver'?n:6+n};var sync=function(){el('hint').textContent=el('color').value==='bronze'?'Starting point: 6 bronze stars.':'Count only stars of the selected color (1-6).';try{var s=stars();el('mapping').textContent='Current stars: '+s+' above starting point - '+(s+6)+' in-game stars.'}catch(e){el('mapping').textContent=''}};var calculate=function(){sync();el('error').textContent='';el('result').innerHTML='';try{var s=stars(),p=Number(el('progress').value);if(el('progress').value===''||!Number.isInteger(p)||p<0)throw new Error('Enter nonnegative whole-number copy progress.');if(s===12&&p!==0)throw new Error('At 6 gold stars, progress must be zero.');if(s<12&&p>=cost(s))throw new Error('Progress must be below '+cost(s)+'. Update the star count if the upgrade is complete.');var title=document.createElement('h2');title.textContent=needed(s,p,12)+' Wish Boxes needed';el('result').appendChild(title);{el('error').textContent=e.message}};el('calc').addEventListener('click',calculate);el('color').addEventListener('change',function(){el('count').value=el('color').value==='bronze'?6:1;calculate()});['count','progress'].forEach(function(id){el(id).addEventListener('input',calculate)});calculate()})();
</script></body></html>
