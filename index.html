<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Critter Evolution Calculator</title>
<style>
body{font:17px system-ui;background:#111a2b;color:#eef3ff;max-width:560px;margin:40px auto;padding:20px}
section{background:#202e46;padding:24px;border-radius:14px}
label{display:block;margin:18px 0}
input,select,button{font:inherit;padding:10px;border-radius:7px}
input,select{width:100%;box-sizing:border-box}
button{background:#aed7ff;border:0;cursor:pointer}
p{line-height:1.6}
#error{color:#ffb5b5;white-space:pre-wrap}
small{color:#c2d4ef}
</style>
</head>
<body>
<h1>Critter Evolution Calculator</h1>
<section>
<label for="color">Star color</label>
<select id="color">
<option value="bronze">Bronze</option>
<option value="silver">Silver</option>
<option value="gold">Gold</option>
</select>

<label for="count">Number of stars of this color</label>
<input id="count" type="number" min="1" max="6" step="1" value="6">
<small id="hint"></small>

<label for="progress">Copy progress toward the next star</label>
<input id="progress" type="number" min="0" step="1" value="0">

<button id="calc" type="button">Calculate</button>

<p id="error" role="alert"></p>
<div id="result" aria-live="polite"></div>
</section>

<script>
(function () {
  "use strict";

  function byId(id) {
    return document.getElementById(id);
  }

  function cost(stars) {
    return stars < 6 ? 5 : 7;
  }

  function boxesNeeded(currentStars, progress, targetStars) {
    var total = 0;
    for (var stars = currentStars; stars < targetStars; stars++) {
      total += cost(stars);
    }
    return Math.max(0, total - progress);
  }

  function currentStars() {
    var color = byId("color").value;
    var countText = byId("count").value;
    var count = Number(countText);

    if (countText === "" || !Number.isInteger(count) || count < 1 || count > 6) {
      throw new Error("Enter a whole-number star count from 1 to 6.");
    }

    if (color === "bronze" && count !== 6) {
      throw new Error("This calculator starts at 6 bronze stars. Select 6 bronze, or 1-6 silver or gold.");
    }

    if (color === "bronze") return 0;
    if (color === "silver") return count;
    return 6 + count;
  }

  function calculate() {
    var errorBox = byId("error");
    var resultBox = byId("result");

    errorBox.textContent = "";
    resultBox.innerHTML = "";

    try {
      var stars = currentStars();
      var progressText = byId("progress").value;
      var progress = Number(progressText);

      if (progressText === "" || !Number.isInteger(progress) || progress < 0) {
        throw new Error("Enter nonnegative whole-number copy progress.");
      }

      if (stars === 12 && progress !== 0) {
        throw new Error("At 6 gold stars, progress must be zero.");
      }

      if (stars < 12 && progress >= cost(stars)) {
        throw new Error("Progress must be below " + cost(stars) + ". Update the star count if the upgrade is complete.");
      }

      var boxes = boxesNeeded(stars, progress, 12);

      var heading = document.createElement("h2");
      heading.textContent = boxes + " Wish Boxes needed";

      var details = document.createElement("p");
      details.textContent = "Target: 6 gold stars.";

      if (stars < 12) {
        details.textContent += " Current copy progress: " + progress + "/" + cost(stars) + ".";
      } else {
        details.textContent += " Maximum configured star level reached.";
      }

      resultBox.appendChild(heading);
      resultBox.appendChild(details);
    } catch (error) {
      errorBox.textContent = error.message;
    }
  }

  function updateHint() {
    var color = byId("color").value;
    byId("hint").textContent = color === "bronze"
      ? "Starting point: 6 bronze stars."
      : "Count only stars of the selected color (1-6).";
  }

  function start() {
    updateHint();
    calculate();

    byId("calc").addEventListener("click", calculate);
    byId("color").addEventListener("change", function () {
      byId("count").value = byId("color").value === "bronze" ? 6 : 1;
      updateHint();
      calculate();
    });

    byId("count").addEventListener("input", calculate);
    byId("progress").addEventListener("input", calculate);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
